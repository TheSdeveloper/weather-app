<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Weather App | Tatchim</title>
    <!--linking google fonts for icons-->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Search section-->
        <div class="search-section">
            <div class="input-wrapper">
                <span class="material-symbols-outlined">
                    search
               </span>
                <input type="search" placeholder="Enter a city name" class="search-input">
            </div>
            <button class="location-button">
                <span class="material-symbols-outlined">
                    my_location
               </span>
            </button>
        </div>

        <div class="no-result">
            <img src="weather_icons/no_water.png" class="weather-icon">
            <h3 class="title">Something went wrong!</h3>
            <p class="message">We're unable to retrieve the weather details. Ensure you've entered a valid city or try again later</p>
        </div>

        <!-- Weather section -->
         <div class="weather-section">
            <!--Current weather-->
            <div class="current-weather">
                <img src="weather_icons/cloudy_sun.png" class="weather-icon">
                <h2 class="temperature">20 <span>°C</span></h2>
                <p class="description">Partly cloudy</p>
            </div>

            <!-- Hourly weather forecast list -->
            <div class="hourly-weather">
                <ul class="weather-list">
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="weather_icons/cloudy_sun.png" class="weather-icon">
                        <p class="temperature">20°C</p>
                    </li>
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="weather_icons/cloudy_sun.png" class="weather-icon">
                        <p class="temperature">20°C</p>
                    </li>
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="weather_icons/cloudy_sun.png" class="weather-icon">
                        <p class="temperature">20°C</p>
                    </li>
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="weather_icons/cloudy_sun.png" class="weather-icon">
                        <p class="temperature">20°C</p>
                    </li>
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="weather_icons/cloudy_sun.png" class="weather-icon">
                        <p class="temperature">20°C</p>
                    </li>
                    <li class="weather-item">
                        <p class="time">00:00</p>
                        <img src="weather_icons/cloudy_sun.png" class="weather-icon">
                        <p class="temperature">20°C</p>
                    </li>
                </ul>
            </div>
         </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
